# The Tripod loop on a schedule (docs/autonomous.md). Off until you copy it to .github/workflows/loop.yml.
# Needs: mode: autonomous and loop: on in pod.yml, an ANTHROPIC_API_KEY secret, and a token that can push
# branches and open pull requests (the default GITHUB_TOKEN with the permissions below; never an admin token).
name: tripod-loop
on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours; change to suit the sponsor
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tripod-loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Fetch change branches
        run: |
          git fetch origin '+refs/heads/change/*:refs/heads/change/*' || true
          git config user.name "Tripod loop"
          git config user.email "loop@tripod.invalid"
      - name: One loop run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/superceo.sh priorities || true
          git stash --include-untracked || true
          scripts/loop.sh
          git push origin 'refs/heads/change/*:refs/heads/change/*' || true
      - name: Digest
        run: scripts/digest.sh --write
