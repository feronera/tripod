<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Merge by risk: low risk is merged by the agent and accepted later; medium is signed by SuperDev and merged by the agent; high needs every signature and a person merges">
