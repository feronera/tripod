<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Pod of three: one SuperBiz and two SuperDevs; parallel parts are built in separate worktrees, and gate 4 is signed by the SuperDev who did not write the code">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5A6382"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6FF5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#BA9645"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#FFFFFF" stroke="#DDE6F6"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="38" font-size="18" font-weight="700" fill="#345589">Pod of 3: one SuperBiz, two SuperDevs</text>
<text x="32" y="60" font-size="13" fill="#5A6382">Parallel parts let two SuperDevs build at once. Peer review: the gate 4 owner is a SuperDev who did not write the code.</text>
<rect x="350" y="80" width="260" height="92" rx="12" fill="#FAFBFF" stroke="#345589" stroke-width="1.5"/>
<circle cx="380" cy="106" r="7" fill="#345589"/><path d="M368 124 Q368 114 380 114 Q392 114 392 124 Z" fill="#345589"/>
<text x="404" y="110" font-size="15" font-weight="700" fill="#345589" text-anchor="start">SuperBiz · Bee</text>
<text x="404" y="128" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="start">Owns gates 1, 2</text>
<text x="404" y="146" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="start">Cross-checks gates 3, 4</text>
<rect x="690" y="80" width="240" height="92" rx="12" fill="#FFFFFF" stroke="#BA9645" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="730" cy="106" r="7" fill="#BA9645"/><path d="M718 124 Q718 114 730 114 Q742 114 742 124 Z" fill="#BA9645"/>
<text x="754" y="110" font-size="15" font-weight="700" fill="#8A6F2F" text-anchor="start">Escalation</text>
<text x="754" y="128" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="start">Signs gates 2, 4</text>
<text x="754" y="146" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="start">when Risk: high · SuperCEO later</text>
<rect x="40" y="240" width="260" height="120" rx="12" fill="#FFFCF6" stroke="#8A6F2F" stroke-width="1.5"/>
<circle cx="70" cy="266" r="7" fill="#8A6F2F"/><path d="M58 284 Q58 274 70 274 Q82 274 82 284 Z" fill="#8A6F2F"/>
<text x="94" y="270" font-size="15" font-weight="700" fill="#8A6F2F" text-anchor="start">SuperDev · Dan</text>
<text x="94" y="288" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="start">Builds part A</text>
<rect x="56" y="302" width="228" height="44" rx="12" fill="#FFFFFF" stroke="#DDE6F6" stroke-width="1"/>
<text x="70" y="322" font-size="11" font-weight="400" fill="#1A1A3E" text-anchor="start">worktree A: agent writes</text>
<text x="70" y="338" font-size="11" font-weight="400" fill="#5B6FF5" text-anchor="start">app/order_page.py …</text>
<rect x="660" y="240" width="260" height="120" rx="12" fill="#FFFCF6" stroke="#8A6F2F" stroke-width="1.5"/>
<circle cx="690" cy="266" r="7" fill="#8A6F2F"/><path d="M678 284 Q678 274 690 274 Q702 274 702 284 Z" fill="#8A6F2F"/>
<text x="714" y="270" font-size="15" font-weight="700" fill="#8A6F2F" text-anchor="start">SuperDev · Eve</text>
<text x="714" y="288" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="start">Builds part B, or reviews</text>
<rect x="676" y="302" width="228" height="44" rx="12" fill="#FFFFFF" stroke="#DDE6F6" stroke-width="1"/>
<text x="690" y="322" font-size="11" font-weight="400" fill="#1A1A3E" text-anchor="start">worktree B: agent writes</text>
<text x="690" y="338" font-size="11" font-weight="400" fill="#5B6FF5" text-anchor="start">app/server.py …</text>
<rect x="350" y="224" width="260" height="152" rx="12" fill="#FFFFFF" stroke="#5B6FF5" stroke-width="2"/>
<text x="480" y="250" font-size="14" font-weight="700" fill="#1A1A3E" text-anchor="middle">change NNN</text>
<text x="480" y="272" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="middle">plan.md: Parallel parts A, B</text>
<text x="480" y="290" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="middle">each with files:, tests:, owner:</text>
<text x="480" y="316" font-size="11.5" font-weight="600" fill="#5B6FF5" text-anchor="middle">parallel-check --run</text>
<text x="480" y="332" font-size="11.5" font-weight="400" fill="#5A6382" text-anchor="middle">tells the merge order</text>
<rect x="413.0" y="351.0" width="14" height="14" transform="rotate(45 420 358)" fill="#BA9645"/>
<text x="420" y="362" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="453.0" y="351.0" width="14" height="14" transform="rotate(45 460 358)" fill="#BA9645"/>
<text x="460" y="362" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="493.0" y="351.0" width="14" height="14" transform="rotate(45 500 358)" fill="#BA9645"/>
<text x="500" y="362" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="533.0" y="351.0" width="14" height="14" transform="rotate(45 540 358)" fill="#BA9645"/>
<text x="540" y="362" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<path d="M480 172 L480 222" fill="none" stroke="#345589" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="377.7125" y="188" width="204.57500000000002" height="18" rx="9" fill="#FFFFFF"/>
<text x="480" y="201" font-size="10.5" font-weight="600" fill="#5A6382" text-anchor="middle">gates 1-2 owner · 3-4 cross-check</text>
<path d="M300 300 L348 300" fill="none" stroke="#8A6F2F" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M660 300 L612 300" fill="none" stroke="#8A6F2F" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M815 172 L612 236" fill="none" stroke="#BA9645" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#g)"/>
<rect x="677.575" y="201" width="94.85000000000001" height="18" rx="9" fill="#FFFFFF"/>
<text x="725" y="214" font-size="10.5" font-weight="600" fill="#8A6F2F" text-anchor="middle">high risk only</text>
<rect x="30" y="392" width="900" height="62" rx="12" fill="#FAFBFF" stroke="#DDE6F6" stroke-width="1"/>
<text x="48" y="416" font-size="12" font-weight="600" fill="#1A1A3E" text-anchor="start">Peer review: when the pod has 2+ SuperDevs, gate.sh refuses a gate 4 owner who authored code in the change.</text>
<text x="48" y="438" font-size="12" font-weight="400" fill="#5A6382" text-anchor="start">SuperBiz signs or cross-checks every gate, so keep to about 3 SuperDevs per SuperBiz; beyond that, add a SuperBiz or split the pod.</text>
</g></svg>
