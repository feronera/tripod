name: pod-gates

on:
  pull_request:
  pull_request_review:

permissions:
  contents: read
  pull-requests: read
  # lets an approval re-run the earlier failed check on the same commit (see the last step)
  actions: write

jobs:
  pod-gates:
    name: pod-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # check the PR head itself (review.md reviewed_head is compared with HEAD)
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for script tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      # Non-Python project: add steps that install the project stack here (e.g. actions/setup-node and npm ci)
      - name: Tests and gate check
        run: make -f pod.mk pod-check
      - name: Approvals by risk
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pr-check.sh
      # A check that failed before the approval stays failed and keeps the PR blocked, even after the
      # run triggered by the approval passes. Re-run those earlier failed runs for this commit.
      - name: Re-run earlier failed checks for this commit
        if: github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow pod-gates --commit "$SHA" \
            --json databaseId,event,conclusion \
            --jq '.[] | select(.event == "pull_request" and .conclusion == "failure") | .databaseId' |
          while read -r id; do
            echo "re-running run $id"
            gh run rerun "$id" --repo "$GITHUB_REPOSITORY" || true
          done
