name: pod-gates

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for script tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Tests and gate check
        run: make check
